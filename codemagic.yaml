workflows:
  ios-unsigned-build:
    name: DesireKitoko - iOS unsigned build (pour Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Installer les dépendances npm
        script: npm install

      - name: Synchroniser le projet iOS avec Capacitor
        script: npx cap sync ios

      - name: Compiler une archive SANS signature de code
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Empaqueter le .ipa non signé (pour Sideloadly)
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r DesireKitoko-unsigned.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/DesireKitoko-unsigned.ipa
